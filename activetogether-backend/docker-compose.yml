services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: activetogether-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - activetogether-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: activetogether-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - activetogether-network

  api:
    build:
      context: .
      dockerfile: ActiveTogether.WebAPI/Dockerfile
    container_name: activetogether-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=220221;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=${RABBITMQ_USER}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    ports:
      - "5027:8080"
    volumes:
      - uploads-data:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - activetogether-network

  subscriber:
    build:
      context: .
      dockerfile: ActiveTogether.Subscriber/Dockerfile
    container_name: activetogether-subscriber
    env_file:
      - .env
    environment:
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=${RABBITMQ_USER}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - activetogether-network

networks:
  activetogether-network:
    driver: bridge

volumes:
  sqlserver-data:
  uploads-data: